name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile gpu-monitor-tray.py gpu-monitor.py

      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --log-level=INFO GPU-Monitor.spec

      - name: Verify exe
        shell: pwsh
        run: |
          $exe = "dist/GPU-Monitor.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "PyInstaller did not produce $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host ("GPU-Monitor.exe size: {0:N2} MB" -f ($size / 1MB))
          if ($size -lt 1MB) {
            Write-Error "exe is suspiciously small ($size bytes)"
            exit 1
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPU-Monitor-windows
          path: dist/GPU-Monitor.exe
          if-no-files-found: error
          retention-days: 30

      # Artifacts expire and require login to download, so also publish the exe
      # as a real GitHub Release asset (public, permanent, no login needed).
      #  * a git tag (v*)  -> normal release named after the tag
      #  * master builds   -> rolling pre-release "ci-latest", overwritten each build
      - name: Publish GitHub release with the exe
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "dist/GPU-Monitor.exe"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $isTag = ($env:GITHUB_REF_TYPE -eq "tag")

          if ($isTag) {
            $tag  = $env:GITHUB_REF_NAME
            $title = "GPU Monitor $tag"
            $notes = "Windows build for tag $tag, packaged by GitHub Actions with PyInstaller (GPU-Monitor.spec).`nDownload GPU-Monitor.exe below - no installer, no Python."
          } else {
            $tag   = "ci-latest"
            $title = "GPU Monitor CI build (rolling)"
            $notes = "Rolling pre-release: rebuilt on every push to master. This build: commit $env:GITHUB_SHA (short: $($env:GITHUB_SHA.Substring(0,7))), ref $env:GITHUB_REF_NAME.`nBuild log: $runUrl`nDownload GPU-Monitor.exe below - no installer, no Python. It is replaced by the next master build."
          }

          gh release view $tag 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($isTag) {
            if ($exists) {
              gh release upload $tag $exe --clobber
            } else {
              gh release create $tag $exe --title $title --notes $notes
            }
          } else {
            # Rolling build: delete + recreate so the ci-latest tag always points at
            # the commit that was just built (a plain edit would leave an older tag).
            if ($exists) {
              gh release delete $tag --cleanup-tag --yes
            }
            gh release create $tag $exe --title $title --notes $notes --prerelease --target $env:GITHUB_SHA
          }

          gh release view $tag
