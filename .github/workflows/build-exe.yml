name: Build Windows EXE

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile gpu-monitor-tray.py gpu-monitor.py

      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --log-level=INFO GPU-Monitor.spec

      - name: Verify exe
        shell: pwsh
        run: |
          $exe = "dist/GPU-Monitor.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "PyInstaller did not produce $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host ("GPU-Monitor.exe size: {0:N2} MB" -f ($size / 1MB))
          if ($size -lt 1MB) {
            Write-Error "exe is suspiciously small ($size bytes)"
            exit 1
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPU-Monitor-windows
          path: dist/GPU-Monitor.exe
          if-no-files-found: error
          retention-days: 30
